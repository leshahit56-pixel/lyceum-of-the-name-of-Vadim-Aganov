    {% extends "base2.html" %}
    {% block content %}
    <div class="container-left">
        <div class="card shadow-lg border-0 rounded-4 bg-white bg-opacity-95">
                <div class="card-body p-4 p-md-5 text-center">
                    <div style="background: yellow; padding: 10px; margin: 10px;">
    DEBUG: info = {{ info }}
</div>
                    <form method="post" class="login-form">
                    <div class="mb-4">
                        <h3>Введите почту</h3>
                    </div>
                    <div class="mb-4">
                        <input type="email" name="email">
                        <button type="submit" class="bth bth-primary">Отправить код</button>
                        </div>
                        {% if info  == 0 %}

                            <p style="color: red;">Введите email</p>

                        {% elif info == 1 %}
                            <input type="text" class="form-control form-control-lg text-center" 
                                    maxlength="6" 
                                    pattern="\d*" 
                                    inputmode="numeric" 
                                    placeholder="000000">

                        {% endif %}



                    </form>
                </div>

    
        </div>
    </div>
    {% endblock %}
