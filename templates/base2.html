<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Лицей имени Вадима Аганова{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="min-vh-100">

<!-- Шапка -->
<div style="display: flex; justify-content: space-between; align-items: center; padding-left: 20px; padding-top: 20px; padding-right: 20px; margin-bottom: 5rem;">

    <!-- Логотип и название  -->
    <div class="d-flex align-items-center gap-3">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Логотип Лицея"
             style="height: 45px; width: auto;" class="logo-img">
        <h4 class="text-white mb-0 fw-bold">Лицей имени Вадима Аганова</h4>
    </div>

    <!-- Панель с кнопками -->
    <div class="d-flex align-items-center gap-3 bg-dark bg-opacity-25 rounded-4 px-4 py-3" style="backdrop-filter: blur(5px);">

        <!-- Кнопка темы -->
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-light" onclick="setTheme('light')" style="border-top-left-radius: 25px; border-bottom-left-radius: 25px; padding: 8px 15px;">
                ☀️
            </button>
            <button type="button" class="btn btn-light" onclick="setTheme('dark')" style="border-top-right-radius: 25px; border-bottom-right-radius: 25px; padding: 8px 15px;">
                🌙
            </button>
        </div>


    </div>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

<!-- Скрипт для сохранения темы -->
<script>
// Функция установки темы
function setTheme(theme) {
    if (theme === 'dark') {
        document.body.classList.add('dark');
        localStorage.setItem('theme', 'dark');
    } else {
        document.body.classList.remove('dark');
        localStorage.setItem('theme', 'light');
    }
}

// При загрузке страницы - применяем сохраненную тему
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
    document.body.classList.add('dark');
} else {
    document.body.classList.remove('dark');
}
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
