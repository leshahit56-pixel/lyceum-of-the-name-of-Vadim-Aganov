{% extends "base2.html" %}

{% block title %}Тест по Python - ЛиВА{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-9 col-12">

        <div class="card shadow-lg border-0 rounded-4 bg-white bg-opacity-95">
            <div class="card-body p-4 p-md-5">

                <!-- Заголовок -->
                <div class="text-center mb-4">
                    <div class="display-6 mb-2">🐍</div>
                    <h2 class="fw-bold" style="background: linear-gradient(135deg, #0d6efd, #6f42c1); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        Тест по Python
                    </h2>
                    <div class="small text-muted">20 вопросов • От новичка до эксперта</div>
                </div>

                <form id="testForm" onsubmit="checkAnswers(event)">

                    <!-- Уровень 1: Лёгкий  -->
                    <div class="mb-3"><span class="badge bg-success">⭐ Лёгкий уровень</span></div>

                    <div class="mb-4 p-3 rounded-4 border">
                        <h5 class="fw-bold mb-3">1. Какой символ используется для комментариев?</h5>
                        <div class="form-check mb-2"><input class="form-check-input" type="radio" name="q1" value="a"><label>//</label></div>
                        <div class="form-check mb-2"><input class="form-check-input" type="radio" name="q1" value="b"><label>#</label></div>
                        <div class="form-check mb-2"><input class="form-check-input" type="radio" name="q1" value="c"><label>/*</label></div>
                    </div>

                    <!-- Кнопка  проверки -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-lg px-5 rounded-pill">
                            <i class="bi bi-check-lg"></i> Проверить ответы
                        </button>
                    </div>

                </form>

                <div id="resultBlock" style="display: none;" class="mt-4 p-4 rounded-4 text-center"></div>

            </div>
        </div>

    </div>
</div>



{% endblock %}
