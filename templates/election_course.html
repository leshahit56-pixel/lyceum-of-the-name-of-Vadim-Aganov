{% extends "base.html" %}

{% block title %}Выбор курса - ЛиВА{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 col-12">

        <div class="sheet">
            <div class="sheet-kicker">Шаг первый</div>
            <h2 class="mb-2"><span class="title">Курсы</span></h2>
            <p class="text-muted mb-4">Выбери направление и начни обучение.</p>

            <a href="/course/python" class="course-card">
                <svg class="snake" viewBox="0 0 84 34" aria-hidden="true">
                    <path pathLength="1" d="M2 20 C 12 4, 22 4, 32 20 S 52 36, 62 20 S 74 8, 76 14"/>
                    <circle cx="78" cy="15" r="3"/>
                </svg>
                <div>
                    <h3>Основы программирования на Python</h3>
                    <p>Изучите самый популярный язык с нуля</p>
                </div>
                <span class="go">Открыть <span class="arrow">→</span></span>
            </a>

            <div class="course-soon">
                <span>здесь скоро появятся новые курсы…</span>
            </div>
        </div>

    </div>
</div>
{% endblock %}
