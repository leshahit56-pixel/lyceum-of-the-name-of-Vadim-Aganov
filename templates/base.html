<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Лицей имени Вадима Аганова{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="min-vh-100">

<!-- Шапка с логотипом и названием  -->
<div class="d-flex align-items-center gap-3 mb-5" style="padding-left: 20px; padding-top: 20px;">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Логотип Лицея"
         style="height: 45px; width: auto;" class="logo-img">
    <h4 class="text-white mb-0 fw-bold">Лицей имени Вадима Аганова</h4>
</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
